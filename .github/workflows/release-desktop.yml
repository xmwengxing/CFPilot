name: Release Desktop

# 构建并发布 CFPilot 桌面版（Go 单二进制）。
#
# 触发条件：推送 desktop-v* tag（如 desktop-v0.5.5）。
# 与 release-gui.yml 并列存在，互不干扰：
#   - gui-v*     → Electron 版（Windows exe，收尾阶段仍发布）
#   - desktop-v* → Go 版（Windows + Linux）
#
# 版本政策沿用「单一版本源」：tag 里的版本号必须与根 package.json 一致。

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.5.5，须与根 package.json 一致）'
        required: true
        type: string

permissions:
  contents: write
  # 推送到 ghcr.io 需要这个（GITHUB_TOKEN 只能推本仓库的包）。
  # 不新增独立工作流 —— 镜像与桌面二进制是同一次发布的两份产物，
  # 放在同一个 job 里：镜像推失败就不发 Release（避免「Release 已发布但镜像没有」）。
  packages: write

jobs:
  build:
    # 用 ubuntu 而不是 windows：Go 交叉编译不需要目标平台工具链，
    # Linux runner 更快也更便宜，且能顺手在容器里实跑 Linux 产物。
    runs-on: ubuntu-latest
    steps:
      # ⚠️ 必须完整检出（fetch-depth: 0），否则两个回退来源都是坏的：
      #   1. `git tag -l --format='%(contents:body)'` 拿不到 tag 对象，
      #      浅克隆下 tag 退化成轻量引用，%(contents) 返回的是**提交说明**，
      #      于是 Release 正文变成了最近一次 commit 的正文（2026-10-30 实际发生）；
      #   2. 自动变更列表用 `git log PREV..HEAD`，浅克隆只有 1 个提交。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: packages/desktop/go.sum

      - name: 安装依赖
        run: npm ci

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - name: 校验 tag 与根版本一致（单一版本源）
        run: |
          V="${{ steps.ver.outputs.version }}"
          ROOT=$(node -p "require('./package.json').version")
          if [ "$ROOT" != "$V" ]; then
            echo "::error::tag 版本 $V 与根 package.json 版本 $ROOT 不一致。请先 npm run version:bump -- $V 并提交，再打 tag。"
            exit 1
          fi
          echo "版本一致：$V"

      - name: 构建内核与界面
        run: |
          npm run build -w @cfpilot/worker-core
          npm run build -w @cfpilot/ui

      - name: Go 单元测试
        working-directory: packages/desktop
        run: go test ./...

      - name: Go vet
        working-directory: packages/desktop
        run: go vet ./...

      - name: 安装 go-winres（生成 exe 图标与版本属性）
        # ⚠️ 2026-10-29 事故：这里以前**没有安装 go-winres**。
        # build-desktop.mjs 的 findWinres() 找不到就只 warn 一句然后继续编译，
        # 于是 CI 发布的每个 windows exe 都「没有图标、没有版本属性」，
        # 而本地因为装过 go-winres 一切正常 —— 用户报「仓库下载的 exe 没图标」。
        #
        # 版本必须与 scripts/build-desktop.mjs 里的 WINRES_VERSION 保持一致
        # （v0.3.3：上游当前最新 release）。两处 pin 同一个版本，
        # CI 与本地打出来的 exe 资源才可比；用 @latest 会让行为随上游发版漂移。
        #
        # 装了之后 build-desktop.mjs 会命中「本机 go-winres」分支，
        # 不必每次 `go run`（那要现场编译工具，约多花 20 秒）。
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          # setup-go 不保证把 $GOPATH/bin 放进 PATH（build-desktop.mjs 内部
          # 也会兜底找 $GOPATH/bin，这里显式加上更直观、也方便手动调试）
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # 装不上就当场失败，别留到构建阶段才暴露
          "$(go env GOPATH)/bin/go-winres" --help > /dev/null
          echo "go-winres 已安装：$(go env GOPATH)/bin/go-winres"

      - name: 交叉编译三平台产物
        run: node scripts/build-desktop.mjs

      - name: 校验 windows 产物已内嵌图标（硬校验，防静默回归）
        # 只做一件事：**证明要发布的 exe 里真的有图标资源**。
        #
        # 2026-10-29 的故障是「CI 没装 go-winres → 静默跳过 → 用户下载的 exe 没图标」，
        # 这种问题从「构建成功」完全看不出来，所以必须直接检查产物本身。
        #
        # 两层校验：
        #   1) rsrc_windows_amd64.syso 必须存在且非空 —— go build 靠它自动拾取资源；
        #   2) exe 的 PE 资源目录里必须真的有 RT_GROUP_ICON(14)。
        #      第 2 层才是终点：syso 生成了但因放错目录没被链接，
        #      同样会得到没图标的 exe（历史上就踩过这个坑）。
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          SYSO="packages/desktop/cmd/cfpilot/rsrc_windows_amd64.syso"
          EXE="packages/desktop/dist/cfpilot-${V}-windows-amd64.exe"

          echo "== 1/2 资源文件 =="
          if [ ! -s "$SYSO" ]; then
            echo "::error::缺少 $SYSO —— windows exe 会没有图标与版本属性（go-winres 没执行成功）"
            exit 1
          fi
          ls -l "$SYSO"

          echo "== 2/2 exe 资源目录里必须有 RT_GROUP_ICON(14) =="
          node -e '
            const fs = require("node:fs");
            const file = process.argv[1];
            const b = fs.readFileSync(file);
            if (b[0] !== 0x4d || b[1] !== 0x5a) { console.error("::error::不是 MZ/PE 文件"); process.exit(1); }
            const pe = b.readUInt32LE(0x3c);
            if (b.toString("latin1", pe, pe + 4) !== "PE\u0000\u0000") { console.error("::error::PE 签名不对"); process.exit(1); }
            const opt = pe + 24;
            const magic = b.readUInt16LE(opt);
            const ddOff = magic === 0x10b ? 96 : 112;
            const resRva = b.readUInt32LE(opt + ddOff + 2 * 8);
            if (resRva === 0) { console.error(`::error::${file} 没有资源节 —— 图标与版本属性都没链进去`); process.exit(1); }
            const nsec = b.readUInt16LE(pe + 6);
            const sec = opt + b.readUInt16LE(pe + 20);
            let base = -1;
            for (let i = 0; i < nsec; i++) {
              const s = sec + i * 40, va = b.readUInt32LE(s + 12);
              const span = Math.max(b.readUInt32LE(s + 8), b.readUInt32LE(s + 16));
              if (resRva >= va && resRva < va + span) { base = resRva - va + b.readUInt32LE(s + 20); break; }
            }
            if (base < 0) { console.error("::error::资源 RVA 无法映射到任何节"); process.exit(1); }
            const n = b.readUInt16LE(base + 12) + b.readUInt16LE(base + 14);
            const types = [];
            for (let i = 0; i < n; i++) {
              const e = base + 16 + i * 8;
              const nameField = b.readUInt32LE(e), offField = b.readUInt32LE(e + 4);
              if (nameField & 0x80000000) continue;
              if (!(offField & 0x80000000)) continue;
              types.push(nameField & 0xffff);
            }
            console.log("资源类型 id：", types.join(", ") || "(空)");
            if (!types.includes(14)) { console.error("::error::exe 里没有 RT_GROUP_ICON(14) —— 图标没链进去"); process.exit(1); }
            console.log(`✅ ${file} 含 RT_GROUP_ICON（exe 有图标）`);
          ' "$EXE"

      - name: 准备内核资产（供远程获取）
        # ⚠️ 部署用的内核代码必须能**独立于应用版本**更新：
        # 用户没升级 CLI / 桌面版时，仍应能部署到最新的内核。
        # 所以把 control.js / dataplane.js 作为 Release 资产发布，
        # 应用在部署前从 Release 拉取最新版本（见 internal/kernel/remote.go）。
        run: |
          mkdir -p packages/desktop/kernel-assets
          cp packages/worker-core/dist/control.js   packages/desktop/kernel-assets/cfpilot-kernel-control.js
          cp packages/worker-core/dist/dataplane.js packages/desktop/kernel-assets/cfpilot-kernel-dataplane.js
          # ⚠️ 同时发布**摘要清单**：CLI 与桌面版只从官方地址取它，
          # 再逐个校验下载到的内核产物 —— 镜像被替换 / 文件被篡改时
          # 必须能拒绝部署，而不是把未知代码推进用户的 Cloudflare 账号。
          # 格式：sha256sum 标准输出（<hex>  <文件名>），两端解析器都按此实现。
          ( cd packages/desktop/kernel-assets && sha256sum cfpilot-kernel-control.js cfpilot-kernel-dataplane.js > cfpilot-kernel-SHA256SUMS )
          # 同时发布手动部署用的 zip（Pages 上传格式）
          node scripts/make-pages-zip.mjs
          ls -la packages/desktop/kernel-assets/
          cat packages/desktop/kernel-assets/cfpilot-kernel-SHA256SUMS

      - name: 实跑 Linux 产物（冒烟测试）
        # 交叉编译出的二进制只保证「能生成」，不保证「能运行」。
        # 这里真的执行一次 --version 和 --check，避免发出跑不起来的包。
        run: |
          BIN="packages/desktop/dist/cfpilot-${{ steps.ver.outputs.version }}-linux-amd64"
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --check

      - name: 生成桌面版摘要清单
        # 应用内更新会从**官方地址**取这份清单，逐个校验下载到的安装包。
        # 镜像只用于搬运文件，清单不经镜像 —— 否则镜像可以同时替换两者。
        # 文件名必须与上传后的资产名一致（应用按 URL 最后一段查表）。
        run: |
          set -e
          cd packages/desktop/dist
          : > cfpilot-desktop-SHA256SUMS
          for f in cfpilot-*; do
            [ "$f" = "cfpilot-desktop-SHA256SUMS" ] && continue
            sha256sum "$f" >> cfpilot-desktop-SHA256SUMS
          done
          sort -k2 cfpilot-desktop-SHA256SUMS -o cfpilot-desktop-SHA256SUMS
          cat cfpilot-desktop-SHA256SUMS

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CFPilot-desktop-${{ steps.ver.outputs.version }}
          path: packages/desktop/dist/*
          retention-days: 30

      # ─────────────────────────────────────────────────────────────
      # 容器镜像
      # ─────────────────────────────────────────────────────────────
      #
      # 为什么不做成独立工作流：
      #   镜像里装的就是上面编出来的那个二进制，两者必须同版本、同一次发布。
      #   拆成两个工作流就会出现「二进制发了镜像没发」这种半成品状态，
      #   而且 GitHub 的 Actions 页面会多一个入口（本来就三个了）。
      #
      # 为什么镜像不在自己内部编译：
      #   Dockerfile 只 COPY 一个预编译的静态二进制，构建秒级完成。
      #   多架构由各自的二进制装配（buildx 会按 TARGETARCH 取对应那份），
      #   不用 QEMU 跑 Go 编译（慢十倍）。
      #
      # ⚠️ 但基础镜像里的 `RUN apk add` 是要**执行**的 ——
      #    arm64 那份要靠 QEMU 模拟，所以下面要装 qemu-action。

      - name: 确定镜像名
        id: image
        run: |
          # ghcr 要求镜像名全小写。
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/cfpilot" >> "$GITHUB_OUTPUT"
          echo "镜像：ghcr.io/${OWNER}/cfpilot"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # ⚠️ 只在**打 tag** 时才推镜像。
          # workflow_dispatch 是试跑 —— 那时的 HEAD 未必与已发布的某个版本对应，
          # 推上去会用错的二进制冒充那个版本号。
          push: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验镜像可拉取
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.name }}"
          VERSION="${{ steps.ver.outputs.version }}"
          # 从 registry 拉一份刚推的，确认多架构清单与标签都对。
          docker pull "$IMAGE:$VERSION"
          docker manifest inspect "$IMAGE:$VERSION" | head -30
          echo "镜像可用：$IMAGE:$VERSION"

      - name: 生成发布说明
        id: notes
        # 说明来源优先级：
        #   1. 仓库外的 .release-notes/<tag>.md（本地写好，git add -f 提交时带上）
        #   2. tag 注释正文
        #   3. 都没有 → 发布失败（绝不回退到 commit 列表）
        #
        # ⚠️ 为什么不用 tag 注释做主来源：git 的 tag 注释格式规定
        #    「第一段是标题、空行后才是正文」，Markdown 的 ## 标题会被
        #    当成段落分隔丢掉。所以正式发布说明用文件更可靠。
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="desktop-v${VERSION}"
          BODY=""

          # 1. 专用说明文件（不入库，用 git add -f 单独带上）
          for f in ".release-notes/${VERSION}.md" ".release-notes/${TAG}.md"; do
            if [ -f "$f" ]; then
              echo "使用说明文件：$f"
              BODY=$(cat "$f")
              break
            fi
          done

          # 2. tag 注释
          if [ -z "$BODY" ]; then
            BODY=$(git tag -l --format='%(contents:body)' "$TAG" 2>/dev/null || true)
            [ -n "$BODY" ] && echo "使用 tag 注释"
          fi

          # 3. 都没有 → **直接失败**，绝不回退到 commit 列表
          #
          # ⚠️ 2026-10-31 教训：回退到 `git log` 会把 commit 正文（含排查过程、
          #    内部讨论）原样贴到 Release 页面。发布说明是给用户看的变更清单，
          #    宁可让发布失败，也不能把开发过程发出去。
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::缺少 .release-notes/${VERSION}.md（或 tag 注释），发布中止。"
            echo "请写好发布说明（只含 新增 / 修复 / 优化 三项）后重试。"
            exit 1
          fi

          # 追加安装说明
          {
            printf '%s\n\n' "$BODY"
            printf -- '---\n\n'
            printf '**下载后直接运行**：Windows 双击 `.exe`；Linux 先 `chmod +x`。\n\n'
            printf 'CLI 工具：`npm i -g cfpilot`，然后运行 `cfpilot` 进入中文菜单。\n'
            printf '\n**容器镜像**：`docker pull ghcr.io/xmwengxing/cfpilot:%s`\n' "$VERSION"
            printf '（linux/amd64 与 linux/arm64；默认只允许本机访问，详见仓库 README 的 Docker 章节）\n'
          } > release_body.md

          {
            echo 'body<<DSH_EOF'
            cat release_body.md
            echo 'DSH_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          # ⚠️ 关键：**所有版本共用同一个 Release**（`v<版本号>`）。
          #
          # 2026-10-26 之前 gui-v* 与 desktop-v* 各自建一个 Release，
          # 结果 GitHub 的 Releases 页面默认只显示 Latest 那一个，
          # 用户在 gui-v0.6.1 页面看不到 Go 版的 3 个包，以为没发布。
          #
          # 现在统一用 `v<版本号>`：
          #   - Electron 版已停发（2026-10-27），本 Release 只有 Go 版 3 个文件
          #   - 触发用的 tag（desktop-v*）保持不变，不影响现有流程
          #   - 正文来自 tag 注释（见下方「生成发布说明」步骤）
          tag_name: v${{ steps.ver.outputs.version }}
          name: CFPilot v${{ steps.ver.outputs.version }}
          files: |
            packages/desktop/dist/*
            packages/desktop/kernel-assets/*
            CFPilot-control.zip
            CFPilot-dataplane.zip
          # 正文来自 tag 注释（2026-10-27 起 RELEASE_NOTES.md 不入库）
          #
          # 发布说明怎么写：
          #   git tag -a desktop-v0.7.3 -F notes.txt   # 或 -m "多行内容"
          #   git push origin desktop-v0.7.3
          #
          # 没有 tag 注释时回退到自动生成的变更列表。
          body: ${{ steps.notes.outputs.body }}

  # ─────────────────────────────────────────────────────────────
  # 安卓版 APK
  # ─────────────────────────────────────────────────────────────
  #
  # 单独一个 job（不单独开工作流 —— 同一个 tag、同一份 Release）。
  #
  # 为什么单独一个 job 而不是塞进 build 那个：
  #   安卓要 NDK + Android SDK + Gradle，工具链与桌面版完全不同，
  #   混在一个 job 里会让「桌面版构建」被安卓的工具链拖累，
  #   而且安卓那边失败不该把已经能发的桌面二进制也拖下水。
  #
  # 产物会**追加**到同一个 Release（tag_name 仍是 v<版本>）。
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: packages/desktop/go.sum

      # GitHub 的 ubuntu runner 自带 Android SDK 与 NDK，
      # 这里只需要确认路径与版本。
      - name: 准备 Android 工具链
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "--- SDK:"; ls "${ANDROID_HOME}" | head -10
          echo "--- NDK:"; ls "${ANDROID_HOME}/ndk" || echo "（没有预装 NDK）"

      - name: 安装依赖
        run: npm ci

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 构建内核与界面
        run: |
          npm run build -w @cfpilot/worker-core
          npm run build -w @cfpilot/ui
          node scripts/gen-desktop-icons.mjs

      - name: 把界面与内核资产塞进 Go 包
        # 与桌面版同一套：界面与内核资产都是 go:embed 进二进制的，
        # 所以 APK 里的 .so 与桌面版 exe 装的是**同一份**资源。
        run: node scripts/build-desktop.mjs --assets-only

      - name: 编译安卓内核（c-shared → .so）
        # 每个 ABI 一份 .so，放进 jniLibs 由 Gradle 打进 APK。
        #
        # ⚠️ 必须 CGO_ENABLED=1：-buildmode=c-shared 走 cgo，
        #    交叉编译器由 NDK 提供（CC / CXX 指向 NDK 里的 clang）。
        run: |
          set -euo pipefail
          cd packages/desktop
          # ⚠️ 不要引用 ${ANDROID_NDK_VERSION} —— runner 上没有这个环境变量，
          #    而 set -u 会让未定义变量直接终止脚本。
          # 优先用 27.x：Go 1.24 的 cgo 与它配合最稳（NDK 28+ 换了 clang 默认值）。
          NDK_BIN=""
          for d in "${ANDROID_HOME}"/ndk/27.*; do
            if [ -d "$d/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
              NDK_BIN="$d/toolchains/llvm/prebuilt/linux-x86_64/bin"
              break
            fi
          done
          if [ -z "$NDK_BIN" ]; then
            NDK_BIN="$(ls -d "${ANDROID_HOME}"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK_BIN" ]; then
            echo "::error::找不到 NDK 的 clang 工具链（${ANDROID_HOME}/ndk 下有什么？）"
            ls -la "${ANDROID_HOME}/ndk" || true
            exit 1
          fi
          echo "NDK 工具链：$NDK_BIN"
          "$NDK_BIN/aarch64-linux-android24-clang" --version | head -2
          OUT=../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="$NDK_BIN/aarch64-linux-android24-clang++" \
            go build -buildmode=c-shared -o "$OUT/libcfpilot.so" \
            -ldflags="-s -w -X main.Version=${{ steps.ver.outputs.version }}" \
            ./cmd/cfpilot-android
          ls -la "$OUT"

          # ⚠️ 必须确认 JNI 符号真的在 .so 里。
          #
          # JVM 是**按名字**找符号的（Java_<包>_<类>_<方法>）：
          # 符号不在库里，运行时就是 UnsatisfiedLinkError —— 而这个错误
          # 只在真机上才暴露，编译期完全看不出来。
          #
          # 所以这里硬校验：符号表里必须有这两个。
          for sym in Java_com_xmwengxing_cfpilot_NativeBridge_nativeStart \
                     Java_com_xmwengxing_cfpilot_NativeBridge_nativeStop; do
            if ! nm -D "$OUT/libcfpilot.so" | grep -q " T $sym$"; then
              echo "::error::$OUT/libcfpilot.so 里缺少 JNI 符号 $sym"
              nm -D "$OUT/libcfpilot.so" | grep Java_ || true
              exit 1
            fi
            echo "  ✓ 符号 $sym"
          done

      - name: 编译 APK
        working-directory: packages/android
        run: |
          set -euo pipefail
          # 用 wrapper 固定 Gradle 版本（runner 上装的是哪个版本不由我们控制）。
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon :app:assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: CFPilot-android-${{ steps.ver.outputs.version }}
          path: packages/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 把 APK 追加到 Release
        # 不给 body —— Release 已经由 build job 创建并写好正文，
        # 这里只追加资产。正文为空时 softprops 不会覆盖已有正文 ✓
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: packages/android/app/build/outputs/apk/release/*.apk
