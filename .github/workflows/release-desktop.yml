name: Release Desktop

# 构建并发布 CFPilot 桌面版（Go 单二进制）。
#
# 触发条件：推送 desktop-v* tag（如 desktop-v0.5.5）。
# 与 release-gui.yml 并列存在，互不干扰：
#   - gui-v*     → Electron 版（Windows exe，收尾阶段仍发布）
#   - desktop-v* → Go 版（Windows + Linux）
#
# 版本政策沿用「单一版本源」：tag 里的版本号必须与根 package.json 一致。

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.5.5，须与根 package.json 一致）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    # 用 ubuntu 而不是 windows：Go 交叉编译不需要目标平台工具链，
    # Linux runner 更快也更便宜，且能顺手在容器里实跑 Linux 产物。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: packages/desktop/go.sum

      - name: 安装依赖
        run: npm ci

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - name: 校验 tag 与根版本一致（单一版本源）
        run: |
          V="${{ steps.ver.outputs.version }}"
          ROOT=$(node -p "require('./package.json').version")
          if [ "$ROOT" != "$V" ]; then
            echo "::error::tag 版本 $V 与根 package.json 版本 $ROOT 不一致。请先 npm run version:bump -- $V 并提交，再打 tag。"
            exit 1
          fi
          echo "版本一致：$V"

      - name: 构建内核与界面
        run: |
          npm run build -w @cfpilot/worker-core
          npm run build -w @cfpilot/ui

      - name: Go 单元测试
        working-directory: packages/desktop
        run: go test ./...

      - name: Go vet
        working-directory: packages/desktop
        run: go vet ./...

      - name: 交叉编译三平台产物
        run: node scripts/build-desktop.mjs

      - name: 实跑 Linux 产物（冒烟测试）
        # 交叉编译出的二进制只保证「能生成」，不保证「能运行」。
        # 这里真的执行一次 --version 和 --check，避免发出跑不起来的包。
        run: |
          BIN="packages/desktop/dist/cfpilot-${{ steps.ver.outputs.version }}-linux-amd64"
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --check

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CFPilot-desktop-${{ steps.ver.outputs.version }}
          path: packages/desktop/dist/*
          retention-days: 30

      - name: 生成发布说明
        id: notes
        # 优先用 tag 注释；为空则回退到自动变更列表
        run: |
          set -e
          TAG="desktop-v${{ steps.ver.outputs.version }}"
          # tag 注释正文（去掉 tag 名那一行）
          NOTES=$(git tag -l --format='%(contents)' "$TAG" || true)
          # 去掉首行的 tag 名称
          NOTES=$(printf '%s\n' "$NOTES" | tail -n +2 | sed '/^$/d' | head -c 60000 || true)

          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "tag 无注释，回退到自动变更列表"
            # 只跟上一个 desktop-* tag 比较（v* 与 desktop-* 指向同一提交，比较结果为空）
            PREV=$(git tag -l 'desktop-v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
            if [ -n "$PREV" ]; then
              NOTES=$(git log --pretty=format:'- %s' "$PREV..HEAD" | head -50)
            else
              NOTES=$(git log --pretty=format:'- %s' -20)
            fi
          fi

          # 追加安装说明
          {
            printf '%s\n\n' "$NOTES"
            printf -- '---\n\n'
            printf '**下载后直接运行**：Windows 双击 .exe；Linux 先 `chmod +x`。\n'
            printf 'CLI 工具：`npm i -g cfpilot` 然后运行 `cfpilot`。\n'
          } > release_body.md

          {
            echo 'body<<DSH_EOF'
            cat release_body.md
            echo 'DSH_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          # ⚠️ 关键：**所有版本共用同一个 Release**（`v<版本号>`）。
          #
          # 2026-10-26 之前 gui-v* 与 desktop-v* 各自建一个 Release，
          # 结果 GitHub 的 Releases 页面默认只显示 Latest 那一个，
          # 用户在 gui-v0.6.1 页面看不到 Go 版的 3 个包，以为没发布。
          #
          # 现在统一用 `v<版本号>`：
          #   - Electron 版已停发（2026-10-27），本 Release 只有 Go 版 3 个文件
          #   - 触发用的 tag（desktop-v*）保持不变，不影响现有流程
          #   - 正文来自 tag 注释（见下方「生成发布说明」步骤）
          tag_name: v${{ steps.ver.outputs.version }}
          name: CFPilot v${{ steps.ver.outputs.version }}
          files: packages/desktop/dist/*
          # 正文来自 tag 注释（2026-10-27 起 RELEASE_NOTES.md 不入库）
          #
          # 发布说明怎么写：
          #   git tag -a desktop-v0.7.3 -F notes.txt   # 或 -m "多行内容"
          #   git push origin desktop-v0.7.3
          #
          # 没有 tag 注释时回退到自动生成的变更列表。
          body: ${{ steps.notes.outputs.body }}