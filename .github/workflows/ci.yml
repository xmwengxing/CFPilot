name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: 构建
        run: npm run build
      - name: 校验内置内核资产与最新构建一致
        run: |
          npm run build -w @cfpilot/worker-core
          npm run build -w cfpilot-deploy
          git diff --exit-code packages/deploy-wizard/assets/cfpilot-worker.js
      - name: 上传内核产物
        uses: actions/upload-artifact@v4
        with:
          name: cfpilot-worker
          path: packages/worker-core/dist/worker.js
