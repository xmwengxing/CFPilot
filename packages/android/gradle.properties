# CFPilot 安卓版 —— Gradle 属性
#
# ⚠️ AndroidX 必须显式开启：AGP 8 里只要依赖里有 androidx.*，
#    少了这一项就会在 checkReleaseAarMetadata 任务上直接失败
#    （「contains AndroidX dependencies, but android.useAndroidX is not enabled」）。
android.useAndroidX=true

# 不需要 Jetifier：依赖全是 AndroidX 时代的，没有老 support 库要转换。
# 开着它只会拖慢构建。
android.enableJetifier=false

# Kotlin 代码风格
kotlin.code.style=official

# 构建 JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 并行 + 缓存
org.gradle.parallel=true
org.gradle.caching=true
