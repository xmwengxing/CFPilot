name: Release GUI

on:
  push:
    tags:
      - 'gui-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建内核与 CLI
        run: |
          npm run build -w @cfpilot/worker-core
          npm run build -w cfpilot-deploy
          npm run build -w cfpilot-scanner

      - name: 确定版本号
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^gui-v', ''
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$v"

      - name: 校验 tag 与根版本一致（单一版本源）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $root = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($root.version -ne $v) {
            Write-Error "tag 版本 $v 与根 package.json 版本 $($root.version) 不一致。统一版本号政策：所有包同版本，请先 npm run version:bump -- $v 并提交，再打 tag。"
            exit 1
          }
          Write-Host "版本一致：$v"

      - name: 同步 GUI 版本号
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $p = "packages/gui/package.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.version = $v
          $j | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding utf8

      - name: 打包 GUI
        shell: pwsh
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          # npm 的 allowScripts 策略会拦 electron-builder 的子进程安装
          npm_config_allow_scripts: 'true'
        run: |
          cd packages/gui
          npm run build
          npx -y electron-builder@25.1.8 --win --publish never

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: CFPilot-gui-${{ steps.ver.outputs.version }}
          path: packages/gui/release/*.exe
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@v2
        with:
          # ⚠️ 关键：与 release-desktop.yml 共用同一个 Release（`v<版本号>`）。
          #
          # 2026-10-26 之前 gui-v* 与 desktop-v* 各自建一个 Release，
          # GitHub 的 Releases 页面默认只显示 Latest，
          # 用户在 gui-v0.6.1 页面看不到 Go 版的包，以为没发布。
          #
          # 现在统一到 `v<版本号>`：一个 Release 里同时有 5 个文件
          # （2 个 Electron + 3 个 Go），用户一眼就能选。
          tag_name: v${{ steps.ver.outputs.version }}
          name: CFPilot v${{ steps.ver.outputs.version }}
          files: packages/gui/release/*.exe
          generate_release_notes: true
          body: |
            ## CFPilot v${{ steps.ver.outputs.version }}

            两种图形化工具，**任选其一**，功能与界面完全相同：

            ### 🟢 Go 版（推荐，体积仅 7 MB）

            | 平台 | 文件 | 用法 |
            |---|---|---|
            | Windows x64 | `cfpilot-${{ steps.ver.outputs.version }}-windows-amd64.exe` | 双击运行，托盘常驻 |
            | Linux x64 | `cfpilot-${{ steps.ver.outputs.version }}-linux-amd64` | `chmod +x` 后运行 |
            | Linux arm64 | `cfpilot-${{ steps.ver.outputs.version }}-linux-arm64` | 同上 |

            单文件静态可执行程序，**不是安装包**，无需安装、零依赖。
            运行后托盘出现图标，浏览器自动打开管理界面。

            ### ⚪ Electron 版（过渡形态，77 MB）

            | 平台 | 文件 |
            |---|---|
            | Windows x64 | `CFPilot-${{ steps.ver.outputs.version }}-x64.exe`（安装版） |
            | Windows x64 | `CFPilot-${{ steps.ver.outputs.version }}-portable.exe`（免安装） |

            > Electron 版为**过渡形态**：Go 版发满 3 个版本后不再提供，
            > 源码永久保留。优先使用 Go 版。

            ### 两个版本的关系

            - **共用同一份界面源码**，操作完全一致
            - **共用同一份凭据文件**（`~/.cfpilot-gui/secrets.json`），换版本不用重填 Token
            - 详见 [README](https://github.com/xmwengxing/CFPilot#图形化工具)

      - name: 提交版本号变更
        if: startsWith(github.ref, 'refs/tags/gui-v')
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add packages/gui/package.json
          if (git diff --cached --quiet) {
            Write-Host "版本号无变化，跳过提交"
          } else {
            git commit -m "chore(gui): 发布版本 ${{ steps.ver.outputs.version }}"
            # tag 已存在时 main 上可能有新提交，用 --force-with-lease 避免非快进被拒
            git push origin HEAD:main --force-with-lease
          }
