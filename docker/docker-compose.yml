# CFPilot 桌面版 · 容器编排示例
#
# ─────────────────────────────────────────────────────────────
# 安全模型（先读这段，再改配置）
# ─────────────────────────────────────────────────────────────
#
# 面板持有 **Cloudflare Token 的读写权限**，能部署与删除 Cloudflare 项目、
# 读写 KV、查看全部优选池与订阅密钥。
#
# 容器里**谁能访问**由两件事共同决定，缺一不可：
#
#   ① 宿主机上的端口映射 —— 真正的边界
#      -p 127.0.0.1:19726:19726   只有这台机器能访问 ✅
#      -p 19726:19726               整个局域网能访问 ⚠️
#
#   ② Host 头校验 —— 只挡浏览器，不管非浏览器客户端
#      浏览器从局域网访问时 Host 是局域网 IP，默认会被判「非法 Host」拒绝。
#      设 CFPILOT_ALLOW_LAN=1 才放行。
#      ⚠️ 但非浏览器客户端可以随便伪造 Host 头绕过它 ——
#         所以这一层**不是访问控制**，别把它当安全保障。
#
# 结论：**端口映射才是边界**。想开放到局域网，两处都要改，
#      并且只在可信网络里这么做。永远不要直接暴露到公网。
#
# ─────────────────────────────────────────────────────────────
# 想让局域网访问？改这两处
# ─────────────────────────────────────────────────────────────
#
#   ports:
#     - "19726:19726"          # ① 去掉 127.0.0.1 前缀
#   environment:
#     CFPILOT_ALLOW_LAN: "1"    # ② 显式开启（启动时会打风险警告）
#
# ⚠️⚠️ 风险 ⚠️⚠️
#
# 局域网里任何设备都能打开面板，拿到面板的人能：
#   - 读取你保存的 Cloudflare Token（明文存在配置目录里）；
#   - 用你的账号部署 / 删除 Cloudflare 项目、读写 KV；
#   - 查看你的优选池、订阅密钥与所有历史记录。
#
# 只在**可信网络**（自己家的路由器、自己的办公网）里这么做，用完记得关掉。

services:
  cfpilot:
    # 本地构建：docker build -f docker/Dockerfile -t cfpilot:local docker
    # 从仓库发布：ghcr.io/xmwengxing/cfpilot:0.30.0
    image: cfpilot:local
    container_name: cfpilot
    restart: unless-stopped

    # 端口映射：默认只绑宿主机回环地址。
    # 容器内监听 19726（与桌面版一致）。
    ports:
      - "127.0.0.1:19726:19726"

    # 数据卷：配置、凭据、内核缓存都在这里。
    # 不挂的话容器一删数据就没了（Cloudflare Token 也要重填）。
    volumes:
      - cfpilot-data:/data

    environment:
      # 配置目录（与上面的卷对应）
      CFPILOT_DATA_DIR: /data
      # 监听端口
      CFPILOT_PORT: "19726"
      # 局域网访问开关：默认关。
      # ⚠️ 改成 "1" 前请先读本文件开头的风险说明。
      CFPILOT_ALLOW_LAN: "0"
      # 启动令牌：固定它，容器重启后地址不变。
      # 不设的话每次启动都会变（只能从 docker logs 里翻）。
      # ⚠️ 它不是密码 —— 换成 Cookie 之后长期有效，别把它当访问控制用。
      # CFPILOT_BOOT_TOKEN: "换成你自己的随机串"
      # 时区：定时任务的「运行时刻」按它解析
      TZ: Asia/Shanghai

volumes:
  cfpilot-data:
