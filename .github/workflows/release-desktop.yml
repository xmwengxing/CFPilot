name: Release Desktop

# 构建并发布 CFPilot 桌面版（Go 单二进制）。
#
# 触发条件：推送 desktop-v* tag（如 desktop-v0.5.5）。
# 与 release-gui.yml 并列存在，互不干扰：
#   - gui-v*     → Electron 版（Windows exe，收尾阶段仍发布）
#   - desktop-v* → Go 版（Windows + Linux）
#
# 版本政策沿用「单一版本源」：tag 里的版本号必须与根 package.json 一致。

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.5.5，须与根 package.json 一致）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    # 用 ubuntu 而不是 windows：Go 交叉编译不需要目标平台工具链，
    # Linux runner 更快也更便宜，且能顺手在容器里实跑 Linux 产物。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: packages/desktop/go.sum

      - name: 安装依赖
        run: npm ci

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - name: 校验 tag 与根版本一致（单一版本源）
        run: |
          V="${{ steps.ver.outputs.version }}"
          ROOT=$(node -p "require('./package.json').version")
          if [ "$ROOT" != "$V" ]; then
            echo "::error::tag 版本 $V 与根 package.json 版本 $ROOT 不一致。请先 npm run version:bump -- $V 并提交，再打 tag。"
            exit 1
          fi
          echo "版本一致：$V"

      - name: 构建内核与界面
        run: |
          npm run build -w @cfpilot/worker-core
          npm run build -w @cfpilot/gui

      - name: Go 单元测试
        working-directory: packages/desktop
        run: go test ./...

      - name: Go vet
        working-directory: packages/desktop
        run: go vet ./...

      - name: 交叉编译三平台产物
        run: node scripts/build-desktop.mjs

      - name: 实跑 Linux 产物（冒烟测试）
        # 交叉编译出的二进制只保证「能生成」，不保证「能运行」。
        # 这里真的执行一次 --version 和 --check，避免发出跑不起来的包。
        run: |
          BIN="packages/desktop/dist/cfpilot-${{ steps.ver.outputs.version }}-linux-amd64"
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --check

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CFPilot-desktop-${{ steps.ver.outputs.version }}
          path: packages/desktop/dist/*
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          # ⚠️ 关键：**所有版本共用同一个 Release**（`v<版本号>`）。
          #
          # 2026-10-26 之前 gui-v* 与 desktop-v* 各自建一个 Release，
          # 结果 GitHub 的 Releases 页面默认只显示 Latest 那一个，
          # 用户在 gui-v0.6.1 页面看不到 Go 版的 3 个包，以为没发布。
          #
          # 现在统一用 `v<版本号>`：
          #   - Release 页面一眼能看到全部 5 个文件
          #   - 触发用的 tag（desktop-v*）保持不变，不影响现有流程
          #   - 两个工作流谁先跑完谁建 Release，后跑的直接追加文件
          tag_name: v${{ steps.ver.outputs.version }}
          name: CFPilot v${{ steps.ver.outputs.version }}
          files: packages/desktop/dist/*
          generate_release_notes: true
          body: |
            ## CFPilot v${{ steps.ver.outputs.version }}

            两种图形化工具，**任选其一**，功能与界面完全相同：

            ### 🟢 Go 版（推荐，体积仅 7 MB）

            | 平台 | 文件 | 用法 |
            |---|---|---|
            | Windows x64 | `cfpilot-${{ steps.ver.outputs.version }}-windows-amd64.exe` | 双击运行，托盘常驻 |
            | Linux x64 | `cfpilot-${{ steps.ver.outputs.version }}-linux-amd64` | `chmod +x` 后运行 |
            | Linux arm64 | `cfpilot-${{ steps.ver.outputs.version }}-linux-arm64` | 同上 |

            单文件静态可执行程序，**不是安装包**，无需安装、零依赖。
            运行后托盘出现图标，浏览器自动打开管理界面。

            ### ⚪ Electron 版（过渡形态，77 MB）

            | 平台 | 文件 |
            |---|---|
            | Windows x64 | `CFPilot-${{ steps.ver.outputs.version }}-x64.exe`（安装版） |
            | Windows x64 | `CFPilot-${{ steps.ver.outputs.version }}-portable.exe`（免安装） |

            > Electron 版为**过渡形态**：Go 版发满 3 个版本后不再提供，
            > 源码永久保留。优先使用 Go 版。

            ### 两个版本的关系

            - **共用同一份界面源码**，操作完全一致
            - **共用同一份凭据文件**（`~/.cfpilot-gui/secrets.json`），换版本不用重填 Token
            - 详见 [README](https://github.com/xmwengxing/CFPilot#图形化工具)
