name: Publish npm

# 打 tag 时自动发布两个公开 npm 包。
#
# ## 为什么用 automation token 而不是 OTP
#
# 你提到每次 `npm publish` 都要输 2FA 验证码，很麻烦。
# CI 里没法交互输入 OTP，所以需要：
#
#   1. 到 npm 网站创建一个 **Automation** 类型的 Access Token
#      （Automation token 可以绕过 2FA，Classic 的 "Publish" 类型不行）
#   2. 把它存进 GitHub 仓库 Secrets，名字 `NPM_TOKEN`
#
# 配置一次，之后打 tag 就全自动了。
#
# ## 触发条件
#
#   - 打 `v*` tag（如 v0.6.4）→ 发布 npm
#   - 也支持手动触发（workflow_dispatch），方便补发
#
# ## 与 Release 工作流的关系
#
#   release-desktop.yml / release-gui.yml 负责编译产物 + 建 GitHub Release
#   本工作流只负责 npm 包，两者互不干扰，都由同一个 tag 触发
#
# ## 幂等性
#
# npm 不允许覆盖已发布版本。所以本工作流会**先检查该版本是否已存在**，
# 已存在就跳过，不报错 —— 这样重复跑不会失败。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查不发布（dry run）'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag 版本：$TAG_VERSION"
          echo "package.json 版本：$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag 与根 package.json 版本不一致（单一版本源政策）"
            exit 1
          fi

      - name: 构建
        run: npm run build

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 校验内置内核资产与最新构建一致
        run: |
          npm run build -w @cfpilot/worker-core
          npm run build -w cfpilot-deploy

          if git diff --exit-code packages/deploy-wizard/assets/cfpilot-worker.js; then
            echo "内置内核资产与最新构建一致 ✅"
            exit 0
          fi

          # ── 不一致时的判定 ──
          #
          # BUILD_VERSION 里含 **git 短 hash**（形如 `42884b2-3e4e4b8c`）。
          # CI 检出的是当前提交，而仓库里的资产是上一个提交构建的，
          # 两者的 hash 必然不同 —— 这是设计使然，不是错误。
          #
          # 所以只把「**忽略版本串后仍有差异**」判定为真正的不一致
          # （那才说明源码改了但忘了同步资产）。
          echo "检测到差异，正在排除 BUILD_VERSION 的影响…"

          # 把两边的版本串都替换成占位符再比
          cp packages/deploy-wizard/assets/cfpilot-worker.js /tmp/committed.js
          # 提交版：替换掉形如 "xxxxxxxx-xxxxxxxx" 的版本串
          sed -E 's/"[0-9a-f]{7,10}-[0-9a-f]{4,16}"/"<BUILD>"/g' /tmp/committed.js > /tmp/committed.norm.js
          # 当前构建版
          sed -E 's/"[0-9a-f]{7,10}-[0-9a-f]{4,16}"/"<BUILD>"/g' \
            packages/deploy-wizard/assets/cfpilot-worker.js > /tmp/fresh.norm.js

          if diff -q /tmp/committed.norm.js /tmp/fresh.norm.js > /dev/null; then
            echo "✅ 除版本串外完全一致（版本串含 git hash，CI 上必然不同，属正常）"
            exit 0
          fi

          echo "::error::内置内核资产与源码不一致（排除版本串后仍有差异）"
          diff -u /tmp/committed.norm.js /tmp/fresh.norm.js | head -60
          echo ""
          echo "修复：本地执行 npm run build -w @cfpilot/worker-core && npm run build -w cfpilot-deploy 后提交"
      - name: 发布 cfpilot-scanner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/publish-npm.mjs cfpilot-scanner

      - name: 发布 cfpilot-deploy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/publish-npm.mjs cfpilot-deploy

      - name: 验证发布结果
        # 发布后等一下让 registry 生效，再查一次
        run: |
          sleep 15
          node scripts/verify-npm-publish.mjs
